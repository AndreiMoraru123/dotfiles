config-version = 2

start-at-login = true

after-startup-command = []

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'dev.zed.Zed'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'company.thebrowser.Browser'
run = 'move-node-to-workspace 2'

# # Float apps that don't make sense tiled
[[on-window-detected]]
if.app-name-regex-substring = 'finder'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'teams'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'windows'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'activity'
run = 'layout floating'

# Terminal on the laptop, code and browser on the external; unmatched falls back to main.
[workspace-to-monitor-force-assignment]
1 = 'built-in'
2 = ['LEN', 'secondary']
3 = ['LEN', 'secondary']
4 = 'built-in'
5 = 'built-in'

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 5
inner.vertical   = 5
outer.left       = 5
outer.right      = 5
outer.top        = 5
outer.bottom     = 5

[mode.main.binding]

# Focus
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move windows
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Move window to other monitor
alt-shift-m = 'move-node-to-monitor --wrap-around --focus-follows-window next'

# Minimize window
alt-m = 'macos-native-minimize'

# Resize
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# Layout
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
alt-ctrl-f = 'layout floating'
alt-ctrl-t = 'layout tiling'
alt-ctrl-shift-f = 'fullscreen'

# Workspaces
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'

# Move node to workspace, follow it
alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
alt-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'

# Quick workspace navigation
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# App launchers. Focus the app, cycling through its windows if it is already
# focused, or launch it if it has none. Matching is on bundle id -- the previous
# inline greps also matched window titles, so alt-a hit "Google Search".
# See scripts/focus-or-launch.sh.
alt-a = 'exec-and-forget /Users/andrei.moraru/Andrei/dotfiles/scripts/focus-or-launch.sh company.thebrowser.Browser'
alt-g = 'exec-and-forget /Users/andrei.moraru/Andrei/dotfiles/scripts/focus-or-launch.sh com.mitchellh.ghostty'
alt-z = 'exec-and-forget /Users/andrei.moraru/Andrei/dotfiles/scripts/focus-or-launch.sh dev.zed.Zed'
alt-c = 'exec-and-forget /Users/andrei.moraru/Andrei/dotfiles/scripts/focus-or-launch.sh com.microsoft.VSCode'
alt-b = 'exec-and-forget /Users/andrei.moraru/Andrei/dotfiles/scripts/focus-or-launch.sh com.google.Chrome'
alt-f = 'exec-and-forget /Users/andrei.moraru/Andrei/dotfiles/scripts/focus-or-launch.sh com.apple.finder'
alt-t = 'exec-and-forget /Users/andrei.moraru/Andrei/dotfiles/scripts/focus-or-launch.sh com.microsoft.teams2'
alt-o = 'exec-and-forget /Users/andrei.moraru/Andrei/dotfiles/scripts/focus-or-launch.sh com.microsoft.Outlook'
alt-r = 'exec-and-forget /Users/andrei.moraru/Andrei/dotfiles/scripts/focus-or-launch.sh com.microsoft.rdc.macos'
alt-u = 'exec-and-forget /Users/andrei.moraru/Andrei/dotfiles/scripts/focus-or-launch.sh ai.unsloth.studio'

# Reload config
alt-shift-r = 'reload-config'

# Screenshot
alt-shift-s = 'exec-and-forget screencapture -i -c'

# Service mode
alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']
